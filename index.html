<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CS2 Live Overlay</title>
  <style>
    :root {
      --scale: 1;
      --panel: rgba(7, 10, 17, 0.84);
      --panel2: rgba(18, 22, 34, 0.92);
      --line: rgba(255,255,255,.14);
      --text: #f6f7fb;
      --muted: #a6aec0;
      --accent: #ffcc3d;
      --score-ct: #57a9ff;
      --live: #4ade80;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: transparent;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      overflow: hidden;
    }
    .wrap { width: 560px; padding: 10px; }
    .match {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 16px 20px 14px;
      background: linear-gradient(135deg, var(--panel2), var(--panel));
      margin-bottom: 10px;
      overflow: hidden;
    }
    .match::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255, 204, 61, .13), transparent 42%);
      pointer-events: none;
    }
    .scoreline {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 22px;
    }
    .team {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }
    .team.left { justify-content: flex-end; }
    .team.right { justify-content: flex-start; }
    /* One box per map a team must win (BO3 → 2, BO5 → 3). Filled = map won. */
    .seriesBoxes {
      display: inline-flex;
      flex-direction: column;
      gap: 6px;
      flex: 0 0 auto;
    }
    .seriesBox {
      width: 14px;
      height: 14px;
      border-radius: 5px;
      border: 1px solid rgba(255,204,61,.40);
      background: rgba(255,204,61,.06);
    }
    .seriesBox.won {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(255,204,61,.5), inset 0 1px 0 rgba(255,255,255,.25);
    }
    .logoBox {
      width: 86px;
      height: 86px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.10);
      overflow: hidden;
    }
    .logoBox img {
      width: 76px;
      height: 76px;
      object-fit: contain;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,.45));
    }
    .scorebox {
      display: flex;
      align-items: center;
      gap: 12px;
      font-variant-numeric: tabular-nums;
    }
    .score {
      min-width: 62px;
      text-align: center;
      font-size: 52px;
      line-height: 1;
      font-weight: 1000;
      color: var(--accent);
      text-shadow: 0 8px 26px rgba(255, 204, 61, .18);
    }
    .score.ct {
      color: var(--score-ct);
      text-shadow: 0 8px 26px rgba(87, 169, 255, .24);
    }
    .sep { color: var(--muted); font-weight: 900; font-size: 34px; padding-bottom: 4px; }
    .upcomingTime {
      min-width: 140px;
      text-align: center;
      font-size: 44px;
      line-height: 1;
      font-weight: 1000;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      letter-spacing: -.02em;
      text-shadow: 0 6px 18px rgba(0,0,0,.4);
    }
    .compact .upcomingTime { font-size: 34px; min-width: 110px; }
    .upcomingTime .timeUnit {
      font-size: 20px;
      font-weight: 800;
      color: var(--muted);
      margin-left: 8px;
      letter-spacing: 0;
      text-shadow: none;
    }
    .compact .upcomingTime .timeUnit { font-size: 15px; margin-left: 6px; }
    .mapline {
      position: relative;
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--muted);
      font-size: 17px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .mapname { color: var(--text); }
    .mapcount {
      color: var(--accent);
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid rgba(255,204,61,.25);
      background: rgba(255,204,61,.09);
    }
    /* Full series map list: upcoming muted, played in normal text, live green+bold. */
    .maps {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 28px;
      flex-wrap: nowrap;
    }
    .mapItem {
      color: var(--muted);
      font-weight: 800;
      position: relative;
      white-space: nowrap;
    }
    .mapMeta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .mapScore {
      font-size: 16px;
      margin-left: 8px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: .03em;
      color: var(--muted);
      opacity: .55;
    }
    .mapItem.doneA .mapScore, .mapItem.doneB .mapScore {
      opacity: 1;
      color: var(--text);
    }
    .mapPickLogo {
      width: 14px;
      height: 14px;
      border-radius: 999px;
      object-fit: contain;
      background: rgba(255,255,255,.06);
      box-shadow: 0 0 0 1px rgba(255,255,255,.08);
      flex: 0 0 auto;
    }
    .mapItem.doneA, .mapItem.doneB { color: var(--text); }
    .mapItem.live {
      color: var(--live);
      font-weight: 1000;
      text-shadow: 0 0 12px rgba(74,222,128,.4);
    }
    .error { margin: 8px 10px 0; color: #ffd0d4; font-size: 12px; opacity: .85; }
    .empty { border: 1px dashed var(--line); border-radius: 18px; padding: 22px; color: var(--muted); background: rgba(0,0,0,.25); }
    .compact .wrap { width: 470px; padding: 6px; }
    .compact .match { border-radius: 20px; padding: 12px 16px 10px; margin-bottom: 8px; }
    .compact .scoreline { gap: 16px; }
    .compact .logoBox { width: 68px; height: 68px; border-radius: 16px; }
    .compact .logoBox img { width: 60px; height: 60px; }
    .compact .team { gap: 7px; }
    .compact .seriesBoxes { gap: 5px; }
    .compact .seriesBox { width: 11px; height: 11px; border-radius: 4px; }
    .compact .score { font-size: 42px; min-width: 48px; }
    .compact .sep { font-size: 28px; }
    .compact .mapline { font-size: 14px; margin-top: 9px; }
  </style>
</head>
<body>
  <main class="wrap">
    <section id="matches"></section>
    <div class="error" id="error"></div>
  </main>
<script>
  const params = new URLSearchParams(location.search);
  if (params.get('compact') === '1') document.body.classList.add('compact');
  if (params.get('scale')) document.documentElement.style.setProperty('--scale', params.get('scale'));

  const matchesEl = document.getElementById('matches');
  const errorEl = document.getElementById('error');

  function scoreSideClass(side) {
    return String(side || '').toUpperCase() === 'CT' ? 'ct' : '';
  }

  function esc(value) { return String(value ?? '').replace(/[&<>"]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s])); }
  function score(value) { return value === null || value === undefined ? '—' : esc(value); }
  function logo(url) {
    if (url) {
      return `<div class="logoBox"><img src="${esc(url)}" onerror="this.parentNode.innerHTML=''"></div>`;
    }
    return `<div class="logoBox"></div>`;
  }
  // One box per map a team needs to win the series (BO3 → 2, BO5 → 3, BO1 → 1).
  // The first `mapsWon` boxes are filled.
  function seriesBoxes(mapsWon, maxMaps) {
    const needed = Math.max(1, Math.ceil((Number(maxMaps) || 3) / 2));
    const won = Number(mapsWon) || 0;
    const boxes = Array.from({ length: needed }, (_, i) =>
      `<span class="seriesBox ${i < won ? 'won' : ''}"></span>`
    ).join('');
    return `<span class="seriesBoxes">${boxes}</span>`;
  }
  function teamLogo(url, mapsWon, maxMaps, side) {
    const badge = seriesBoxes(mapsWon, maxMaps);
    const mark = side === 'left'
      ? `${logo(url)}${badge}`
      : `${badge}${logo(url)}`;
    return `<div class="team ${side}">${mark}</div>`;
  }
  function mapPickLogo(map, match) {
    const pickedBy = String(map?.pickedBy || '').toUpperCase();
    const url = pickedBy === 'A'
      ? match.teamALogo
      : pickedBy === 'B'
        ? match.teamBLogo
        : null;
    return url
      ? `<img class="mapPickLogo" src="${esc(url)}" alt="" loading="lazy" onerror="this.remove()">`
      : '';
  }
  function mapList(m) {
    const maps = Array.isArray(m.maps) ? m.maps : [];
    if (maps.length) {
      const items = maps
        .map(mp => {
          const isDone = mp.state === 'doneA' || mp.state === 'doneB';
          const scoreHtml = isDone && mp.scoreA != null && mp.scoreB != null
            ? `<span class="mapScore">${esc(mp.scoreA)}:${esc(mp.scoreB)}</span>`
            : '';
          return `<span class="mapItem ${esc(mp.state || 'upcoming')}"><span class="mapMeta">${mapPickLogo(mp, m)}<span>${esc(mp.name || '?')}</span>${scoreHtml}</span></span>`;
        })
        .join('');
      return `<div class="maps">${items}</div>`;
    }
    // Fallback if the series map list isn't available yet.
    return `<span class="mapItem live">${esc(m.map || 'Map')}</span>`;
  }

  function render(data) {
    const matches = (data.matches || []).slice(0, 2);
    if (!matches.length) {
      matchesEl.innerHTML = '';
      errorEl.textContent = '';
      return;
    }
    errorEl.textContent = data.error ? `${data.source || 'source'}: ${data.error}` : '';
    matchesEl.innerHTML = matches.map(m => {
      if (m.status === 'UPCOMING') {
        const timeText = m.startTime
          ? new Date(m.startTime).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })
          : '—';
        const timeUnit = m.startTime ? '<span class="timeUnit">Uhr</span>' : '';
        return `
        <article class="match upcoming">
          <div class="scoreline">
            <div class="team left">${logo(m.teamALogo)}</div>
            <div class="scorebox"><div class="upcomingTime">${esc(timeText)}${timeUnit}</div></div>
            <div class="team right">${logo(m.teamBLogo)}</div>
          </div>
          <div class="mapline"><span class="mapcount">UPCOMING</span></div>
        </article>`;
      }
      return `
      <article class="match">
        <div class="scoreline">
          ${teamLogo(m.teamALogo, m.mapsWonA, m.maxMaps, 'left')}
          <div class="scorebox"><div class="score ${scoreSideClass(m.teamASide)}">${score(m.mapScoreA)}</div><div class="sep">:</div><div class="score ${scoreSideClass(m.teamBSide)}">${score(m.mapScoreB)}</div></div>
          ${teamLogo(m.teamBLogo, m.mapsWonB, m.maxMaps, 'right')}
        </div>
        <div class="mapline">${mapList(m)}</div>
      </article>`;
    }).join('');
  }

  // Demo mode: ?demo=1 (one match) or ?demo=2 (two matches).
  // Logos are looked up locally just like in live mode — drop g2.png, fut.png,
  // spirit.png, 9z.png into public/logos/ to preview them.
  const demoMode = params.get('demo');
  const demoMatches = [
    { teamALogo: '/logos/g2.png', teamBLogo: '/logos/fut.svg',
      mapScoreA: 9, mapScoreB: 7, mapsWonA: 1, mapsWonB: 0,
      teamASide: 'CT', teamBSide: 'T',
      map: 'Overpass', mapPosition: 2, maxMaps: 3, status: 'LIVE',
      maps: [{ name: 'Inferno', state: 'doneA', pickedBy: 'A', scoreA: 16, scoreB: 5 }, { name: 'Overpass', state: 'live', pickedBy: 'B' }, { name: 'Mirage', state: 'upcoming', pickedBy: null }] },
    { teamALogo: '/logos/spirit.png', teamBLogo: '/logos/9z.png',
      mapScoreA: 13, mapScoreB: 11, mapsWonA: 0, mapsWonB: 0,
      teamASide: 'T', teamBSide: 'CT',
      map: 'Mirage', mapPosition: 1, maxMaps: 3, status: 'LIVE',
      maps: [{ name: 'Mirage', state: 'live', pickedBy: 'A' }, { name: 'Nuke', state: 'upcoming', pickedBy: 'B' }, { name: 'Ancient', state: 'upcoming', pickedBy: null }] }
  ];

  async function load() {
    if (demoMode) {
      const n = demoMode === '2' ? 2 : 1;
      render({
        source: 'demo',
        matches: demoMatches.slice(0, n),
      });
      return;
    }
    try {
      const res = await fetch('/live.json?ts=' + Date.now(), { cache: 'no-store' });
      render(await res.json());
    } catch (err) {
      errorEl.textContent = 'Overlay kann /live.json nicht laden: ' + err.message;
    }
  }
  load();
  if (!demoMode) setInterval(load, 5000);
</script>
</body>
</html>
